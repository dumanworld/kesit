name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Dosyaların ekleneceği sürümün etiketi (boş bırakılırsa yalnızca derler)'
        required: false

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Çekirdek testler (ffmpeg mantığı)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tests/core.test.js

  selftest:
    name: Uygulama testi (Windows, WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: debug
      - name: Debug derle
        working-directory: src-tauri
        run: cargo build
      - name: Uçtan uca sınama
        shell: pwsh
        run: ./tests/run-selftest.ps1

  build:
    name: Derle (kurulum + taşınabilir)
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
      RELEASING: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - name: Sürüm numarası
        shell: pwsh
        run: |
          # Etiket v1.2.3 ya da 1.2.3 ise uygulamanın sürümü odur; değilse tauri.conf.json'daki kalır.
          if ($env:RELEASING -eq 'true' -and $env:TAG -match '^v?(\d+\.\d+\.\d+)$') {
            $ver = $Matches[1]
            $f = 'src-tauri/tauri.conf.json'
            (Get-Content $f -Raw) -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`"" | Set-Content $f -NoNewline
          }
          "Sürüm: " + (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
      - name: Tauri derle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) { npx tauri build }
          elseif ($env:RELEASING -eq 'true') { throw 'TAURI_SIGNING_PRIVATE_KEY secret eksik: güncelleme dosyaları imzalanamaz.' }
          else {
            Write-Warning 'İmza anahtarı yok; güncelleme dosyaları olmadan derleniyor.'
            Set-Content $env:RUNNER_TEMP/imzasiz.json '{"bundle":{"createUpdaterArtifacts":false}}'
            npx tauri build --config $env:RUNNER_TEMP/imzasiz.json
          }
      - name: Dosyaları hazırla
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "dist/Kesit"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/target/release/Kesit.exe $dir/
          Copy-Item src-tauri/bin/ffmpeg.exe $dir/
          Copy-Item src-tauri/bin/ffmpeg-LICENSE.txt $dir/
          Copy-Item src-tauri/bin/ffmpeg-README.txt $dir/
          Copy-Item BENIOKU.txt $dir/
          Compress-Archive -Path $dir -DestinationPath "dist/Kesit-$ver-tasinabilir.zip" -Force
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName "dist/Kesit-$ver-kurulum.exe"
          # Uygulamanın güncelleme denetimi bu dosyaya bakar (releases/latest/download/latest.json)
          $sig = "$($setup.FullName).sig"
          if (Test-Path $sig) {
            $url = "https://github.com/${{ github.repository }}/releases/download/$([uri]::EscapeDataString($env:TAG))/Kesit-$ver-kurulum.exe"
            $manifest = [ordered]@{
              version   = $ver
              notes     = "Kesit $ver"
              pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              platforms = [ordered]@{ 'windows-x86_64' = [ordered]@{ signature = (Get-Content $sig -Raw).Trim(); url = $url } }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/latest.json -Encoding utf8NoBOM
            Get-Content dist/latest.json
          }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Kesit-Windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/latest.json
          if-no-files-found: error
      - name: Sürüme ekle
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "$env:TAG" --title "Kesit $env:TAG" --generate-notes }
          gh release upload "$env:TAG" (Get-ChildItem dist/*.zip, dist/*.exe, dist/latest.json).FullName --clobber
