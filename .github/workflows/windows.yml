name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Çekirdek testler (ffmpeg mantığı)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node tests/core.test.js

  selftest:
    name: Uygulama testi (Windows, WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: debug
      - name: Debug derle
        working-directory: src-tauri
        run: cargo build
      - name: Uçtan uca sınama
        shell: pwsh
        run: ./tests/run-selftest.ps1

  build:
    name: Derle (kurulum + taşınabilir)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - name: Tauri derle
        run: npx tauri build
      - name: Taşınabilir zip
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $dir = "dist/Kesit"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item src-tauri/target/release/Kesit.exe $dir/
          Copy-Item src-tauri/bin/ffmpeg.exe $dir/
          Copy-Item src-tauri/bin/ffmpeg-LICENSE.txt $dir/
          Copy-Item src-tauri/bin/ffmpeg-README.txt $dir/
          Copy-Item BENIOKU.txt $dir/
          Compress-Archive -Path $dir -DestinationPath "dist/Kesit-$ver-tasinabilir.zip" -Force
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "dist/Kesit-$ver-kurulum.exe"
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Kesit-Windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.exe --title "Kesit ${{ github.ref_name }}" --generate-notes
